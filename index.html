  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaceMaster</title>
    <meta name="description" content="러너를 위한 개인 맞춤형 기록 관리 및 훈련 분석 대시보드. VDOT 계산, 심박존 분석, 가민 CSV 업로드, 마라톤 일정 및 D-day 관리." />
    <meta property="og:title" content="PaceMaster" />
    <meta property="og:description" content="러너를 위한 개인 맞춤형 기록 관리 및 훈련 분석 대시보드. VDOT 계산, 심박존 분석, 가민 CSV 업로드, 마라톤 일정 및 D-day 관리." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Chakra+Petch:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket connection errors in AI Studio preview iframe environment
      window.addEventListener('error', function(e) {
        if (
          (e.filename && e.filename.indexOf('@vite/client') !== -1) ||
          (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('failed to connect') !== -1)) ||
          (e.error && e.error.stack && e.error.stack.indexOf('@vite/client') !== -1)
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = (e.reason && (e.reason.message || e.reason.stack || e.reason)) || '';
        if (String(str).indexOf('@vite/client') !== -1 || String(str).indexOf('WebSocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
